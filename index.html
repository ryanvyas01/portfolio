<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Ryan Vyas — AI Software Engineer</title>
    <meta
      name="description"
      content="Personal portfolio of Ryan Vyas, an AI software engineer at Ziosk working across React Native, C++, C#, and applied AI."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ryan Vyas — AI Software Engineer" />
    <meta
      property="og:description"
      content="Personal portfolio of Ryan Vyas, an AI software engineer at Ziosk working across React Native, C++, C#, and applied AI."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Apply the theme before first paint to avoid a flash of the wrong colour
      scheme. Dark is the default; light is only used if explicitly chosen.
      This must stay in sync with getInitialTheme() in src/hooks/useTheme.ts.
    -->
    <script>
      ;(function () {
        var theme = 'dark'
        try {
          if (localStorage.getItem('portfolio-theme') === 'light') {
            theme = 'light'
          }
        } catch (error) {
          /* localStorage can be unavailable in private mode — default to dark. */
        }
        document.documentElement.classList.toggle('dark', theme === 'dark')
        document.documentElement.style.colorScheme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
